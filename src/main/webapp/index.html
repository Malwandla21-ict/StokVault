<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>StokVault</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230f7b5f'/%3E%3Cpath d='M9 20.5c0 2 2.6 3.5 7 3.5s7-1.3 7-3.6c0-5-13-2.6-13-7.4C10 11 12.4 9 16 9s5.8 1.4 6.4 3.4' fill='none' stroke='white' stroke-width='2.6' stroke-linecap='round'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="css/app.css">
</head>
<body>
<!--
    StokVault dashboard: a small client for the REST API at ./api.
    It holds no business logic; every rule (balances, roles, arrears) is enforced by the server,
    and any refusal is shown as the message the API returns.
-->
<header class="topbar">
    <div class="brand">
        <span class="logo" aria-hidden="true">S</span>
        <span>StokVault</span>
    </div>
    <nav class="tabs" aria-label="Sections">
        <button type="button" class="tab" data-view="stokvels" aria-current="page">Stokvels</button>
        <button type="button" class="tab" data-view="members">Members</button>
    </nav>
    <span id="health" class="health" title="API and database status">Checking...</span>
</header>

<main id="view-stokvels" class="layout">
    <aside class="sidebar">
        <div class="sidebar-head">
            <h2>Stokvels</h2>
            <button type="button" class="btn small primary" id="new-stokvel">New</button>
        </div>
        <ul id="stokvel-list" class="stokvel-list"></ul>
    </aside>
    <section id="stokvel-detail" class="detail">
        <p class="empty">Select a stokvel, or create one.</p>
    </section>
</main>

<main id="view-members" class="page" hidden>
    <div class="page-head">
        <h1>Members</h1>
        <div class="row">
            <input id="member-search" type="search" placeholder="Search name or email" aria-label="Search members">
            <button type="button" class="btn primary" id="new-member">New member</button>
        </div>
    </div>
    <div id="member-table"></div>
</main>

<dialog id="form-dialog">
    <form method="dialog" id="dialog-form">
        <h2 id="dialog-title"></h2>
        <div id="dialog-fields" class="fields"></div>
        <p id="dialog-error" class="form-error" hidden></p>
        <div class="dialog-actions">
            <button type="button" class="btn" id="dialog-cancel">Cancel</button>
            <button type="submit" class="btn primary" id="dialog-submit">Save</button>
        </div>
    </form>
</dialog>

<div id="toasts" class="toasts" aria-live="polite"></div>

<script src="js/app.js"></script>
</body>
</html>
